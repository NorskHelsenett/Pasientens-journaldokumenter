test:
  interruptible: true
  stage: test
  image: ncr.sky.nhn.no/mcr/dotnet/sdk:8.0
  script:

    # Download certificate for tax office from secure files: https://docs.gitlab.com/ee/ci/secure_files/#use-secure-files-in-cicd-jobs
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash

    # Run ApiTests with Testcontainers in cloud. See https://testcontainers.com/cloud/ for more info.
    - curl -fsSL https://app.testcontainers.cloud/bash | bash

    - dotnet test ".NET/Patient Health Records EPJ/solutions/PatientHealthRecordsEPJ/PatientHealthRecordsEPJ/PatientHealthRecordsEPJ.sln" -c Release
