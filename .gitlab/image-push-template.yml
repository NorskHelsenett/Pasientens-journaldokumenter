# This is a GitLab CI template for pushing Docker images using Crane
# Parameters:
# - IMAGE_NAME: The name of the image

.image:push:template:
  interruptible: true
  stage: image-push
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - ls -alh
    # Read image url with digest from file
    - FULL_IMAGE_NAME_DIGEST=$(cat ${IMAGE_NAME}${DIGEST_FILE_SUFFIX})
    - echo "$FULL_IMAGE_NAME_DIGEST"
    - echo "${IMAGE_NAME}_${CI_COMMIT_SHORT_SHA}.tar"
    - crane auth login -u $HARBOR_USER -p $HARBOR_TOKEN $HARBOR_HOST
    - crane push "${IMAGE_NAME}_${CI_COMMIT_SHORT_SHA}.tar" "$FULL_IMAGE_NAME_DIGEST"
    - crane tag "$FULL_IMAGE_NAME_DIGEST" "${VERSION}-${CI_COMMIT_SHORT_SHA}"
  rules:
    # Only push images from main branch
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
