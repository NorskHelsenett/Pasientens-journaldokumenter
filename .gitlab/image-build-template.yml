# This is a GitLab CI template for building Docker images using Kaniko
# Parameters:
# - IMAGE_NAME: The name of the image
# - DOCKERFILE_PATH: The path to the Dockerfile

.image:build:template:
  interruptible: true
  stage: image-build
  dependencies:
    - test
  image: gcr.io/kaniko-project/executor:v1.9.0-debug
  variables:
    KANIKO_DIR: /kaniko
  artifacts:
    untracked: false
    when: on_success
    expire_in: "10 minutes"
    paths:
      - ${IMAGE_NAME}_${CI_COMMIT_SHORT_SHA}.tar
      - ${IMAGE_NAME}-digest.txt
  script:
    - |
      /kaniko/executor \
      --context "$CI_PROJECT_DIR" \
      --destination "${HARBOR_HOST}/${HARBOR_PROJECT}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
      --dockerfile "${DOCKERFILE_PATH}" \
      --build-arg "MCR_REG=ncr.sky.nhn.no/mcr" \
      --no-push \
      --tarPath "${IMAGE_NAME}_${CI_COMMIT_SHORT_SHA}.tar" \
      --image-name-with-digest-file "${IMAGE_NAME}-digest.txt"

