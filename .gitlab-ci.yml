# Manually trigger pipeline by changing this number: 1
include:
  - project: helsepersonell/team-plattform/nhn-ci-template
    file: .gitlab-ci.yml
    ref: "0.19.2"

default:
  tags:
    - 2026-03-standard

variables:
  NHN_AUTO_HARBOR: false
  NHN_AUTO_NUPACK: true
  AUTO_NUPACK_PROJECT_FILENAME: "PatientHealthRecordsEPJ.sln"
  SRC_FOLDER: ".NET/PatientHealthRecordsEPJ/solutions/PatientHealthRecordsEPJ"
  DOTNET_SDK_VERSION: 10.0
  CONTEXT_FOLDER: "."
  IMAGE_NAME: "dokumentdeling-epj"
  
build-image:
  stage: build
  extends:
    - .nhn-image-build-only
  rules:
    - when: on_success
  variables:
    DOCKERFILE: ".NET/PatientHealthRecordsEPJ/docker/epj/Dockerfile"
    CONTEXT_FOLDER: "."
    SRC_FOLDER: "."
    MANIFEST_APP_NAME: "dokumentdeling-epj"
    IMAGE_NAME: dokumentdeling-epj
    NHN_IMAGE_BUILD_ARG_1: $GITLAB_USER_EMAIL
    NHN_DEFAULT_FILTER_EXTRA_PATH: .gitlab-ci.yml
    
scan-image:
  extends:
    - .nhn-image-scan-artifact
  needs:
    - job: 'build-image'
      artifacts: true
  rules:
    - when: on_success
  
push-image-to-harbor:
  extends:
    - .nhn-image-push-harbor
  rules:
    - when: on_success
  variables:
    #IMAGE_NAME: my-image.tar
    IMAGE_NAME: dokumentdeling-epj
    HARBOR_PROJECT: $(HARBOR_PROJECT)
    HARBOR_USER: $(HARBOR_USER)
    HARBOR_TOKEN: $(HARBOR_TOKEN)

# This is for updating the TEST and DEV values.yaml files.
# We use the 'auto detect' app of apps template, which relies on the 'image_name' variable from the container image build jobs
# in order to detect which manifest apps should be updated.
AppOfApps-test:
  extends:
  - .app-of-apps-auto-detect-images-manifest-repo-update
  variables:
    NHN_JOB_RUN_MODE: "manual"
    # This variable points to the values.XXXXXXX.yaml files, in this case 'values.dev.yml' and 'values.test.yml'
    DEPLOY_ENVIRONMENTS: "dev test"
    DEPLOY_BRANCH: "main"

    # This variable says which position/variable in the yaml file to updates.
    # In our case we actually set the value to the same as the default value, to be explicit about it.
    # In this case we want to update 'image.tag' which translates to the following yaml ->
    # image:
    #   tag: cd3af9c
    IMAGE_TAG_FILTER: ".image.tag"
    # SRC_FOLDER is default set to 'manifests' so this should not be needed, but is used here just to be explicit about it.
    SRC_FOLDER: "manifests"
    
    # This url points to what manifest repo we want to update. In this case we update our own repo.
    # Make sure to not have HTTPS, and don't use an ssh/git repo - only use https repo reference.
    MANIFEST_REPO_URL: milliways.nhn.no/helsepersonell/team-dokumentdeling/dokumentdeling-epj/dokumentdeling-epj-manifests.git

    # This username is ignored, and can be set to whatever, but it most be some value
    GITLAB_USER: "whatever"
    NHN_CHANGE_PATH9: ".gitlab-ci.yml"
  rules:
    - when: manual
