# Creates commit and push it to the dodsmelding-manifests repo
.modify-manifest:template:
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  image: ncr.sky.nhn.no/nhn/ci-deploy:0.0.2
  before_script:
    - echo "Starting to clone repo"
    # Read image url with digest from file
    - export EPJ_IMAGE_NAME_DIGEST=$(cat ${EPJ_IMAGE_NAME}${DIGEST_FILE_SUFFIX})    
    # Clone the repository
    - git clone https://:${GITLAB_TOKEN}@${CI_REPO} ${CI_COMMIT_SHORT_SHA}
    - echo "End of clone repo"
    # Set the displayed user with the commits that are about to be made
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
  script:    
    - yq eval -i 'eval(env(EPJ_VALUES_CHART_IMAGE_PATH)).image = env(EPJ_IMAGE_NAME_DIGEST)' ${CI_COMMIT_SHORT_SHA}/${VALUES_CHART_PATH}    
    - cd ${CI_COMMIT_SHORT_SHA}
    - echo "Starting to commit to repo"
    - git commit -am "${TARGET_ENVIRONMENT} - New images uploaded from Dokumentdeling EPJ repo by pipeline"
    - git push origin main
    - echo "End of commit to repo"
