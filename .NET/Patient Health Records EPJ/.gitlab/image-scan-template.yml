# This is a GitLab CI template for scanning Docker images using Trivy
# Parameters:
# - IMAGE_NAME: The name of the image

.image:scan:template:
  interruptible: true
  stage: image-scan
  image:
    name: ncr.sky.nhn.no/dockerhub/aquasec/trivy:latest
    entrypoint: [""]
  variables:
    # No need to clone the repo, we exclusively work on artifacts.  See
    # https://docs.gitlab.com/ee/ci/runners/configure_runners.html#git-strategy
    GIT_STRATEGY: none
  script:
    - ls -alh
    - trivy --version
    # cache cleanup is needed when scanning images with the same tags, it does not remove the database
    - trivy image --clear-cache
    # update vulnerabilities db
    - trivy image --download-db-only --no-progress --cache-dir .trivycache/
    # Builds report and puts it in the default workdir $CI_PROJECT_DIR, so `artifacts:` can take it from there
    - trivy image --exit-code 0 --cache-dir .trivycache/ --no-progress --format template --template "@/contrib/gitlab.tpl"
        --output "$CI_PROJECT_DIR/gl-container-scanning-report.json" --input "${IMAGE_NAME}_${CI_COMMIT_SHORT_SHA}.tar"
    # Prints full report
    - trivy image --exit-code 0 --cache-dir .trivycache/ --no-progress  --input "${IMAGE_NAME}_${CI_COMMIT_SHORT_SHA}.tar"
    # Fail on critical vulnerabilities
    - trivy image --exit-code 1 --cache-dir .trivycache/ --severity CRITICAL --no-progress --input "${IMAGE_NAME}_${CI_COMMIT_SHORT_SHA}.tar"
  cache:
    paths:
      - .trivycache/
  # Enables https://docs.gitlab.com/ee/user/application_security/container_scanning/ (Container Scanning report is available on GitLab EE Ultimate or GitLab.com Gold)
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
