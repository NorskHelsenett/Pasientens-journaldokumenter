version: "3.8"
services:
    sqlserver-2019:
        image: "mcr.microsoft.com/mssql/server:2019-latest"
        environment:
            SA_PASSWORD: "p@ssw0rdIsAwesome" # Password is not sensitive
            ACCEPT_EULA: "Y"
        ports:
            - "9876:1433" # Remap this to avoid collision with existing SQL Server when running locally
        healthcheck:
            # In this case, we use $$SA_PASSWORD to get the value from the running container's environment. 
            # This can be necessary because Docker Compose uses the ${...} syntax for variable substitution in the compose file itself. 
            # By using $$, we are telling Docker Compose to pass the $SA_PASSWORD through as $SA_PASSWORD to the container, instead of trying to substitute it when parsing the Docker Compose file.
            test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -Q "SELECT DATABASE_ID, NAME FROM SYS.DATABASES;" -b -o /dev/null
            interval: 2s
            retries: 10
            start_period: 5s
            timeout: 2s 
        volumes:
            - sqlserver:/var/opt/mssql
    
    api:
        env_file: ./docker/api/api.env
        environment:
        # This will make app use `appsettings.Development.json` in addition to regular `appsettings.json`
        - ASPNETCORE_ENVIRONMENT=Development
        build:
          context: .
          dockerfile: ./docker/api/Dockerfile
        # The container does not have appsettings in its image. Mounting them here so that running `docker compose up` uses the default settings from appsettings.
        volumes:
        - ./solutions/PatientHealthRecordsEPJ/PatientHealthRecordsEPJ/PatientHealthRecordsEPJ/appsettings.json:/app/appsettings.json
        - ./solutions/PatientHealthRecordsEPJ/PatientHealthRecordsEPJ/PatientHealthRecordsEPJ/appsettings.Development.json:/app/appsettings.Development.json
        ports:
        - 8080:80
        depends_on:
            db-migrator:
                condition: service_completed_successfully        
volumes:
    sqlserver:
