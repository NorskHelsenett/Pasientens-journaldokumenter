include:
  - ".gitlab/*.yml"
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  HARBOR_PROJECT: "team-dokumentdeling"
  HARBOR_HOST: "ncr.sky.nhn.no"
  DIGEST_FILE_SUFFIX: "-digest.txt"

  EPJ_IMAGE_NAME: "dokumentdeling-epj"
    
  EPJ_VALUES_CHART_IMAGE_PATH: ".epj"
  
  CI_REPO: "milliways.nhn.no/helsepersonell/team-dokumentdeling/dokumentdeling-epj/dokumentdeling-epj-manifests.git"

  VALUES_CHART_PATH_DEV: "manifests/values.dev.yaml"
  VALUES_CHART_PATH_TEST: "manifests/values.test.yaml"
  VALUES_CHART_PATH_QA: "manifests/values.qa.yaml"
  VALUES_CHART_PATH_PROD: "manifests/values.prod.yaml"
  
  VERSION: "1.0.0" # Edit this to change version number

  # Defines how many directory levels deep that the dependency analyzer should search for supported files
  # https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#configuring-dependency-scanning
  DS_MAX_DEPTH: "3"

# This is a workaround to make central package management with packages.lock.json work with GitLab's dependency scanning.
# GitLab's dependency scanning only supports Nuget's package-lock.json format version 1, but the central package management sets the version to 2.
# This script replaces '"version": 2' with '"version": 1' in all packages.lock.json files.
# See https://gitlab.com/gitlab-org/gitlab/-/issues/398680 for more information.
.prepare_for_dependency_scan:
  before_script:
    - echo "Setting version 1 for packages.lock.json files..."
    - >
      find . -maxdepth $DS_MAX_DEPTH -type f -name packages.lock.json -print0 |
      xargs -0 sed -i 's/"version": 2,/"version": 1,/'
    - echo "Done setting version to 1 for packages.lock.json files!"

# Run prepare before dependency scan job
dependency_scanning:
  extends: .prepare_for_dependency_scan

stages:
  - test
  - image-build
  - image-scan
  - image-push # This only runs on main branch, see image-push.yml
  - manifest-modification
  - manifest-modification-prod

# Run pipline on merge request or main branch
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

image:build:api:
  extends: .image:build:template
  variables:
    IMAGE_NAME: $EPJ_IMAGE_NAME
    DOCKERFILE_PATH: /docker/epj/Dockerfile

image:scan:api:
  extends: .image:scan:template
  variables:
    IMAGE_NAME: $EPJ_IMAGE_NAME
  dependencies:
    - image:build:api

image:push:api:
  extends: .image:push:template
  variables:
    IMAGE_NAME: $EPJ_IMAGE_NAME
  dependencies:
    - image:build:api

modify-manifest:dev:
  extends: .modify-manifest:template
  stage: manifest-modification
  variables:
    VALUES_CHART_PATH: $VALUES_CHART_PATH_DEV
    TARGET_ENVIRONMENT: Dev
  dependencies:
    - image:build:api
    
modify-manifest:test:
  extends: .modify-manifest:template
  stage: manifest-modification
  variables:
    VALUES_CHART_PATH: $VALUES_CHART_PATH_TEST
    TARGET_ENVIRONMENT: Test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  dependencies:
    - image:build:api

modify-manifest:qa:
  extends: .modify-manifest:template
  stage: manifest-modification
  variables:
    VALUES_CHART_PATH: $VALUES_CHART_PATH_QA
    TARGET_ENVIRONMENT: Qa
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  dependencies:
    - image:build:api
    
modify-manifest:prod:
  extends: .modify-manifest:template
  stage: manifest-modification-prod
  variables:
    VALUES_CHART_PATH: $VALUES_CHART_PATH_PROD
    TARGET_ENVIRONMENT: Prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  dependencies:
    - image:build:api    
